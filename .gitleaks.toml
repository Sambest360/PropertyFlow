title = "PropertyFlow"

[extend]
useDefault = true

# PayFast's published documentation example (merchant 10000100 / key 46f0cd694581a /
# passphrase jt7NOE43FZPn). These are not PropertyFlow credentials.
# Allowlist entries are combined: a finding must match one of these paths AND
# one of these regexes. Historical merchant secrets are not listed, so a
# history scan still reports them.
[[allowlists]]
description = "PayFast published signature test vector"
paths = [
  '''(^|/)server/payfast\.test\.ts$''',
  '''(^|/)server/payfast\.itn\.test\.ts$''',
  '''(^|/)scripts/payfast-vector\.mjs$''',
]
regexes = [
  '''10000100''',
  '''46f0cd694581a''',
  '''jt7NOE43FZPn''',
]

# Demo trust-book idempotency keys (PI-…) look like generic API tokens to gitleaks.
# They are fixture ids, not credentials. The built bundle inlines the same seed.
[[allowlists]]
description = "Demo trust idempotency keys"
paths = [
  '''seedTrust\.ts$''',
  '''(^|/)dist/assets/.*\.js$''',
]
regexes = [
  '''PI-[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+''',
]
