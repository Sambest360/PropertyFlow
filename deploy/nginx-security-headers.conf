# Security headers for lekayarentals.site (nginx, http level).
# Install:  cp deploy/nginx-security-headers.conf /etc/nginx/conf.d/propertyflow-security-headers.conf
#           nginx -t && systemctl reload nginx
#
# nginx gotcha: a server or location block that has its OWN add_header line
# stops inheriting these. The live config has none; if one is ever added
# (e.g. Cache-Control on /assets/), repeat these lines there or include this
# file inside that block.

# Hide the exact nginx version from the Server header.
server_tokens off;

# HTTPS only for a year, subdomains included (no preload list).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Only "search near me" (AreaSearch) uses location; camera photos go through
# the file picker, which needs no permission.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Content-Security-Policy: what the app may load, by service.
#   Google Maps JS, static maps, fonts  *.googleapis.com *.gstatic.com *.google.com *.ggpht.com
#   Peach (OPPWA) card widget           *.oppwa.com   PayFast checkout (form post)
#   Sentry error reports                *.sentry.io   Old listing photos (img only, until moved) *.supabase.co
#   Fallback map tiles / reverse geocode  tile.openstreetmap.org, nominatim.openstreetmap.org
#   Demo listing images                 images.unsplash.com
# The one inline handler in index.html (fonts: onload="this.media='all'") is
# allowed by its hash only ('unsafe-hashes'), not inline script in general.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=' https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.oppwa.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.oppwa.com; font-src 'self' data: https://fonts.gstatic.com https://*.oppwa.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://*.googleusercontent.com https://*.supabase.co https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://images.unsplash.com https://*.oppwa.com; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.sentry.io https://nominatim.openstreetmap.org https://*.oppwa.com; frame-src 'self' https://*.google.com https://*.oppwa.com; worker-src 'self' blob:; form-action 'self' https://sandbox.payfast.co.za https://www.payfast.co.za https://www.payfast.io https://*.oppwa.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
