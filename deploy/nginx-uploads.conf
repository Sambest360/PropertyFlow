# Upload size for lekayarentals.site (nginx, http level).
# Install:  cp deploy/nginx-uploads.conf /etc/nginx/conf.d/propertyflow-uploads.conf
#           nginx -t && systemctl reload nginx
#
# nginx's default is 1 MB, so photo and document saves larger than that got an
# HTML "413 Request Entity Too Large" instead of reaching the API. The API
# caps a single photo at 5 MB; documents and multi-photo saves travel as
# base64 JSON (about a third larger), hence 25 MB.
client_max_body_size 25M;
