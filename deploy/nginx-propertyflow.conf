# Installed by deploy/setup.sh BEFORE certbot exists, so it stays :80 only
# with no ssl_certificate lines (nginx -t would fail on missing cert files).
# After DNS points here, run: certbot --nginx --redirect -d lekayarentals.site -d www.lekayarentals.site
# The TLS/redirect target shape is deploy/nginx-propertyflow.tls.conf.example
# (not installed by setup.sh); see deploy/README.md.
# The /assets/ block below is H5's to change (gzip/caching); its add_header
# drops the http-level security headers here (nginx inheritance rule).
server {
    listen 80;
    server_name lekayarentals.site www.lekayarentals.site;
    root /var/www/propertyflow/dist;
    index index.html;
    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
